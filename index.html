const TZ=7,PI=Math.PI,INT=Math.floor,pad=n=>String(n).padStart(2,'0');

  const dt=T<-11?0.001+0.000839*T+0.0002261*T2-0.00000845*T3-0.000000081*T*T3:-0.000278+0.000265*T+0.000262*T2;
  return INT(J+C-dt+.5+TZ/24)}
function sl(j){const T=(j-2451545.5-TZ/24)/36525,T2=T*T,r=PI/180,M=357.5291+35999.0503*T-0.0001559*T2-0.00000048*T*T2,L0=280.46645+36000.76983*T+0.0003032*T2;

/* ---------- Xuất lịch .ics (nhập vào Google Calendar, Apple Lịch, Outlook) ---------- */
const ie=t=>String(t||'').replace(/\\/g,'\\\\').replace(/[,;]/g,'\\$&').replace(/\n/g,'\\n');
const ymd=([d,m,y])=>`${y}${pad(m)}${pad(d)}`;
function ics(){
  const T=today(),tj=jd(...T),ly=s2l(...T)[2],now=new Date().toISOString().replace(/[-:]|\.\d{3}/g,''),
    o=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Gia pha//VI','CALSCALE:GREGORIAN','X-WR-CALNAME:Gia phả'];
  const ev=(uid,date,sum,desc,al,rule)=>{
    o.push('BEGIN:VEVENT',`UID:${uid}@giapha`,`DTSTAMP:${now}`,`DTSTART;VALUE=DATE:${ymd(date)}`,`DTEND;VALUE=DATE:${ymd(jdd(jd(...date)+1))}`,...(rule?['RRULE:'+rule]:[]),`SUMMARY:${ie(sum)}`,`DESCRIPTION:${ie(desc)}`);
    for(const t of al)o.push('BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${ie(sum)}`,`TRIGGER:${t}`,'END:VALARM');
    o.push('END:VEVENT')};
  for(const p of Object.values(P())){
    const b=pd(p.b);
    if(b&&!isD(p)){const dsc=`Sinh ngày ${fmt(...b)} (âm lịch ${lun(...b)})`;
      if(b[1]==2&&b[0]==29){for(let y=T[2];y<T[2]+10;y++){const s=bday(b,y);if(jd(...s)>=tj)ev(`sn-${p.id}-${y}`,s,'Sinh nhật '+p.name,dsc,['-PT15H'])}}
      else{let y=T[2],j=jd(b[0],b[1],y);if(j<tj)j=jd(b[0],b[1],++y);ev('sn-'+p.id,jdd(j),'Sinh nhật '+p.name,dsc,['-PT15H'],'FREQ=YEARLY')}}
    const g=gioDM(p);
    if(g)for(let y=ly;y<ly+10;y++){
      let d=l2s(g[0],g[1],y,0);if(!d)continue;if(s2l(...d)[0]!=g[0])d=jdd(jd(...d)-1);if(jd(...d)<tj)continue;
      const dy=+yr(p.d),n=dy?d[2]-dy:0;
      ev(`gio-${p.id}-${d[2]}`,d,'Giỗ '+p.name,`Ngày giỗ ${g[0]}/${g[1]} âm lịch${p.d?', mất '+vn(p.d):''}${n>0?', '+n+' năm':''}`,['-P6DT15H','-PT15H'])}
  }
  return o.concat('END:VCALENDAR').join('\r\n')}

/* ---------- Xưng hô (theo cách gọi miền Bắc, so tuổi theo năm sinh) ---------- */
const NG=['cháu','chắt','chút','chít'],bs=t=>t.replace(/ \(.*/,'').replace(/ họ$/,'');
function ancs(id){
  const m=new Map([[id,{d:0,path:''}]]);let fr=[id];
  for(let d=1;d<12&&fr.length;d++){const nx=[];
    for(const x of fr){const q=P()[x],e=m.get(x);
      for(const [k,c] of [[q.fid,'f'],[q.mid,'m']])if(k&&P()[k]&&!m.has(k)){m.set(k,{d,path:e.path+c});nx.push(k)}}
    fr=nx}
  return m}
function blood(a,b){
  if(a.id==b.id)return 'chính người này';
  const A=ancs(a.id),B=ancs(b.id);let best=null;
  for(const [k,x] of A){const y=B.get(k);if(y&&(!best||x.d+y.d<best.da+best.db))best={da:x.d,db:y.d,pa:x.path,pb:y.path}}
  if(!best)return null;
  const {da,db,pa,pb}=best,male=b.g!='f',yb=+yr(b.b),ya=+yr(a.b),old=yb&&ya&&yb!=ya?yb<ya:null,side=c=>c=='f'?'nội':'ngoại';
  if(da==0){if(db==1)return male?'con trai':'con gái';if(db==2)return 'cháu '+side(pb[0]);return NG[db-2]||'hậu duệ đời '+db}
  if(db==0){if(da==1)return male?'cha':'mẹ';if(da==2)return (male?'ông ':'bà ')+side(pa[0]);if(da==3)return (male?'cụ ông ':'cụ bà ')+side(pa[0]);if(da==4)return male?'kỵ ông':'kỵ bà';return 'tổ tiên đời thứ '+da+' phía trên'}
  if(da==db){
    if(da==1){const full=a.fid&&a.fid==b.fid&&a.mid&&a.mid==b.mid,t=old==null?(male?'anh hoặc em trai':'chị hoặc em gái'):old?(male?'anh':'chị'):(male?'em trai':'em gái');return t+(full?'':' (cùng cha hoặc cùng mẹ)')}
    return (old==null?'anh/chị/em':old?(male?'anh':'chị'):'em')+' họ'+(da>2?' (họ xa)':'')}
  if(da<db){const d=db-da;return 'cháu'+(da>1?' họ':'')+(da==1&&d==1?' (con của anh/chị/em)':d>1?' (thấp hơn '+d+' đời)':'')}
  const d=da-db,h=db>1?' họ':'';
  if(d==1){const par=P()[pa[0]=='f'?a.fid:a.mid],yp=par?+yr(par.b):0,o=yb&&yp&&yb!=yp?yb<yp:null;
    if(pa[0]=='f')return (o==null?(male?'bác/chú':'bác/cô'):o?'bác':male?'chú':'cô')+h;
    return (o==null?(male?'bác/cậu':'bác/dì'):o?'bác':male?'cậu':'dì')+h}
  if(d==2)return (male?'ông (anh/em của ông bà)':'bà (chị/em của ông bà)')+h;
  return 'họ hàng bậc trên '+d+' đời'}
const inlaw=(t,sa)=>{const suf=sa.g=='f'?'vợ':'chồng',k=bs(t);
  if(k=='cha')return 'bố '+suf;if(k=='mẹ')return 'mẹ '+suf;
  const w=k.split(' ')[0];if(['anh','chị','em'].includes(w)&&!/họ/.test(t))return w+' '+suf;
  return t+' (bên '+suf+')'};
const spouseOf=(t,b)=>{const k=bs(t),M={'chú':'thím','cậu':'mợ','bác':'bác','cô':'dượng','dì':'dượng','em trai':'em dâu','em gái':'em rể','anh':'chị dâu','chị':'anh rể','con trai':'con dâu','con gái':'con rể'};
  if(M[k])return M[k];const m=k.match(/^(ông|bà) (nội|ngoại)$/);if(m)return (m[1]=='ông'?'bà ':'ông ')+m[2];

function rel(a,b){
  const bl=blood(a,b);if(bl)return bl;
  const SA=spo(a),SB=spo(b);
  if(SA.some(x=>x.id==b.id))return b.g=='f'?'vợ':'chồng';
  for(const sa of SA){const t=blood(sa,b);if(t)return inlaw(t,sa)}
  for(const sb of SB){const t=blood(a,sb);if(t)return spouseOf(t,b)}
  return 'chưa xác định (chưa nối được quan hệ trong gia phả)'}

/* ---------- Kiểm tra dữ liệu bất thường ---------- */
function checks(){
  const ps=Object.values(P()),out=[],Y=p=>+yr(p.b)||0,D=p=>+yr(p.d)||0,now=new Date().getFullYear(),dup={};
  const add=(p,t,m)=>out.push({id:p.id,t,m});
  for(const p of ps){
    if(p.cf=='nv')add(p,'luuy','Thông tin được đánh dấu nghi vấn, cần kiểm tra thêm'+(p.src?` (nguồn: ${p.src})`:''));
    for(const [k,lb,gd] of [['fid','Cha','m'],['mid','Mẹ','f']]){
      const q=P()[p[k]],l=lb.toLowerCase();
      if(p[k]&&!q){add(p,'loi',`${lb} không còn trong gia phả`);continue}
      if(!q)continue;
      if(q.g!=gd)add(p,'loi',`${lb} (${q.name}) đang ghi giới tính ${q.g=='f'?'nữ':'nam'}`);
      if(ancs(q.id).has(p.id))add(p,'loi',`Vòng lặp quan hệ: ${p.name} vừa là con vừa là tổ tiên của ${l} (${q.name})`);
      const by=Y(p),qy=Y(q);
      if(by&&qy){const a=by-qy;
        if(a<0)add(p,'loi',`Sinh năm ${by}, trước ${l} (${q.name}, sinh năm ${qy})`);
        else if(a<14)add(p,'luu',`${lb} (${q.name}) mới ${a} tuổi khi sinh ${p.name}`);
        else if(a>(gd=='f'?50:80))add(p,'luu',`${lb} (${q.name}) đã ${a} tuổi khi sinh ${p.name}`)}
      const qd=D(q);
      if(by&&qd&&(gd=='f'?by>qd:by>qd+1))add(p,'loi',`Sinh năm ${by}, sau khi ${l} (${q.name}) mất năm ${qd}`)}
    if(Y(p)&&D(p)){const a=D(p)-Y(p);if(a<0)add(p,'loi',`Mất năm ${D(p)}, trước khi sinh năm ${Y(p)}`);else if(a>110)add(p,'luu',`Thọ ${a} tuổi, hãy kiểm tra lại năm sinh và năm mất`)}
    if(Y(p)>now)add(p,'loi',`Năm sinh ${Y(p)} nằm trong tương lai`);
    if(Y(p)&&!isD(p)&&now-Y(p)>110)add(p,'luu',`Sinh năm ${Y(p)} nhưng chưa đánh dấu đã mất`);
    for(const x of spAll(p)){const sp=P()[x];
      if(!sp)add(p,'loi','Vợ/chồng không còn trong gia phả');
      else if(!spIds(sp).includes(p.id))add(p,'luu',`Quan hệ vợ/chồng với ${sp.name} chưa ghi nhận hai chiều`);
      if(sp&&p.id<sp.id){const ay=Math.abs(Y(p)-Y(sp));
        if(Y(p)&&Y(sp)&&ay>30)add(p,'luu',`Chênh lệch tuổi với vợ/chồng ${sp.name} là ${ay} năm`);
        if(ancs(p.id).has(sp.id)||ancs(sp.id).has(p.id))add(p,'loi',`${sp.name} vừa là vợ/chồng vừa là tổ tiên hoặc con cháu`);
        else if((p.fid&&p.fid==sp.fid)||(p.mid&&p.mid==sp.mid))add(p,'luu',`${sp.name} là vợ/chồng nhưng cùng cha hoặc cùng mẹ`)}}
    if(Y(p))(dup[norm(p.name)+'|'+Y(p)]=dup[norm(p.name)+'|'+Y(p)]||[]).push(p)}
  {const sb={};for(const p of ps){const d=pd(p.b);if(d&&p.mid)(sb[p.mid]=sb[p.mid]||[]).push([jd(...d),p])}
   for(const k in sb){const l=sb[k].sort((a,b)=>a[0]-b[0]);for(let i=1;i<l.length;i++){const g=l[i][0]-l[i-1][0];if(g>0&&g<270)add(l[i][1],'luu',`Sinh sau ${l[i-1][1].name} (cùng mẹ) chỉ ${g} ngày, ngắn hơn một thai kỳ`)}}}
  for(const k in dup)if(dup[k].length>1)dup[k].forEach(p=>add(p,'luu',`Có thể trùng với ${dup[k].filter(x=>x!=p).map(x=>x.name).join(', ')} (cùng tên và năm sinh)`));
  return out}

/* ---------- Trình cài đặt: làm từng bước, bỏ qua được, mở lại bất cứ lúc nào trong Cài đặt ---------- */
/*GS_SRC_BEGIN*/const GS_SRC="/**\n * GIA PHẢ - MÁY CHỦ TRÊN GOOGLE APPS SCRIPT\n * Chạy bằng tài khoản Google của quản trị viên; toàn bộ dữ liệu nằm trong Drive của tài khoản này.\n * Cách dùng: script.google.com > Dự án mới > dán toàn bộ tệp này > điền CLIENT_ID bên dưới >\n * Triển khai > Tùy chọn triển khai mới > Ứng dụng web > Thực thi với tư cách: Tôi; Quyền truy cập: Bất kỳ ai\n * > Triển khai > cấp quyền > sao chép URL (kết thúc bằng /exec) dán vào ứng dụng.\n * Mọi quyền được kiểm tra tại đây: người lạ không đọc hay ghi được dù biết địa chỉ.\n */\nconst CLIENT_ID = 'DÁN_CLIENT_ID_VÀO_ĐÂY.apps.googleusercontent.com';\nconst FILE = 'giapha-data.json', FOLDER = 'giapha-anh';\nconst FIELDS = ['name', 'hu', 'tu', 'th', 'bd', 'src', 'cf', 'g', 'b', 'bp', 'pl', 'chi', 'd', 'gd', 'gm', 'bur', 'dead', 'rs', 'tel', 'mail', 'ct', 'job', 'edu', 'wp', 'fid', 'mid', 'sid', 'xs', 'note', 'ph', 'fr'];\n\n// Làm sạch nội dung do thành viên gửi lên: chỉ nhận các trường đã biết, giới hạn độ dài, bỏ quan hệ trỏ tới người không tồn tại\nconst MAXLEN = { xs: 300, src: 500, hu: 100, tu: 100, th: 100, bd: 200, cf: 2, note: 2000, bur: 300, pl: 300, bp: 300, rs: 300, ct: 300, wp: 300, job: 200, edu: 200, mail: 200, chi: 100 };\nconst PID_RE = /^[A-Za-z0-9_-]{3,24}$/;\nfunction clean_(person, db, pid) {\n  const o = {};\n  FIELDS.forEach(k => {\n    if (k == 'ph' || person[k] === undefined || person[k] === null) return;\n    o[k] = String(person[k]).slice(0, MAXLEN[k] || 100);\n  });\n  delete o.fr; // khung ảnh do quản trị viên quyết định, thành viên không đặt được\n  if (person.ph === '') o.ph = ''; else if (okImg_(person.ph)) o.ph = person.ph; // '' = xin xoá ảnh đại diện\n  if (o.g && o.g != 'm' && o.g != 'f') o.g = 'm';\n  if (o.cf && o.cf != 'kc' && o.cf != 'nv') o.cf = '';\n  ['fid', 'mid', 'sid'].forEach(k => { if (o[k] && (o[k] == pid || !db.people[o[k]])) o[k] = ''; });\n  if (o.xs) o.xs = o.xs.split(',').map(x => x.trim()).filter((x, i, a) => x && x != pid && db.people[x] && a.indexOf(x) == i).slice(0, 10).join(',');\n  return o;\n}\nconst MAX_PENDING = 30;\n// Ảnh đại diện gửi kèm đề xuất: chỉ nhận ảnh nhỏ dạng data URL, tối đa 40.000 ký tự\nfunction okImg_(s) { return typeof s == 'string' && s.length <= 40000 && /^data:image\\/(jpeg|png|webp);base64,[A-Za-z0-9+\\/=]+$/.test(s); }\n\n// Thông tin liên hệ: chỉ quản trị viên và người được cấp quyền mới nhận được (máy chủ cắt bỏ trước khi gửi đi)\nconst CONTACT = ['rs', 'tel', 'mail', 'ct', 'wp'];\nfunction strip_(db) {\n  const o = { people: {}, updated: db.updated };\n  for (const k in db.people) { const p = Object.assign({}, db.people[k]); CONTACT.forEach(f => delete p[f]); o.people[k] = p; }\n  return o;\n}\n\n// ---- Thông báo email (chỉ gửi tên người, loại thay đổi, tên trường; không gửi nội dung như số điện thoại) ----\nconst LBL = { fr: 'Khung ảnh', ph: 'Ảnh đại diện', name: 'Họ tên', hu: 'Tên húy', tu: 'Tên tự', th: 'Tên thụy, hiệu', bd: 'Tên gọi khác', src: 'Nguồn', cf: 'Độ tin cậy', g: 'Giới tính', b: 'Ngày sinh', bp: 'Nơi sinh', pl: 'Quê quán', chi: 'Chi, phái', d: 'Ngày mất', gd: 'Giỗ (ngày)', gm: 'Giỗ (tháng)', bur: 'Nơi an táng', dead: 'Đã mất', rs: 'Nơi ở hiện tại', tel: 'Điện thoại', mail: 'Email', ct: 'Liên hệ khác', job: 'Nghề nghiệp', edu: 'Học vấn', wp: 'Nơi làm việc', fid: 'Cha', mid: 'Mẹ', sid: 'Vợ/chồng', xs: 'Vợ/chồng khác', note: 'Ghi chú', fl: 'Tài liệu' };\nconst OPV = { add: 'thêm người', edit: 'sửa thông tin', del: 'xoá người' };\nfunction nt_(d) { return Object.assign({ admin: true, member: true, url: '' }, d.notify || {}); }\nfunction mail_(to, subject, body) {\n  try {\n    if (!to || MailApp.getRemainingDailyQuota() < 1) return;\n    MailApp.sendEmail(to, String(subject).replace(/[\\r\\n]+/g, ' ').slice(0, 150), body);\n  } catch (e) { /* lỗi gửi thư không được làm hỏng thao tác chính */ }\n}\nfunction link_(n) { return n.url ? '\\n\\nMở ứng dụng: ' + n.url : ''; }\n\n// ---- Nhật ký sửa đổi: chỉ ghi tên trường đã đổi, không ghi nội dung (tránh lộ số đ 0001178 * T2 - 0.000000155 * T3 + 0.00033 * S(166.56 + 132.87 * T - 0.009173 * T2);\n  const M = 359.2242 + 29.10535608 * k - 0.0000333 * T2 - 0.00000347 * T3, Mp = 306.0253 + 385.81691806 * k + 0.0107306 * T2 + 0.00001236 * T3, F = 21.2964 + 390.67050646 * k - 0.0016528 * T2 - 0.00000239 * T3;\n  const C = (0.1734 - 0.000393 * T) * S(M) + 0.0021 * S(2 * M) - 0.4068 * S(Mp) + 0.0161 * S(2 * Mp) - 0.0004 * S(3 * Mp) + 0.0104 * S(2 * F) - 0.0051 * S(M + Mp) - 0.0074 * S(M - Mp) + 0.0004 * S(2 * F + M) - 0.0004 * S(2 * F - M) - 0.0006 * S(2 * F + Mp) + 0.001 * S(2 * F - Mp) + 0.0005 * S(2 * Mp + M);\n  const dt = T < -11 ? 0.001 + 0.000839 * T + 0.0002261 * T2 - 0.00000845 * T3 - 0.000000081 * T * T3 : -0.000278 + 0.000265 * T + 0.000262 * T2;\n  return INT(J + C - dt + .5 + TZ / 24);\n}\nfunction sl(j) {\n  const T = (j - 2451545.5 - TZ / 24) / 36525, T2 = T * T, r = Math.PI / 180, M = 357.5291 + 35999.0503 * T - 0.0001559 * T2 - 0.00000048 * T * T2, L0 = 280.46645 + 36000.76983 * T + 0.0003032 * T2;\n  const DL = (1.9146 - 0.004817 * T - 0.000014 * T2) * Math.sin(r * M) + (0.019993 - 0.000101 * T) * Math.sin(r * 2 * M) + 0.00029 * Math.sin(r * 3 * M);\n  let L = (L0 + DL) * r; L -= Math.PI * 2 * INT(L / (Math.PI * 2)); return INT(L / Math.PI * 6);\n}\nfunction m11(y) { const k = INT((jd(31, 12, y) - 2415021) / 29.530588853); let n = nm(k); if (sl(n) >= 9) n = nm(k - 1); return n; }\nfunction leapOff(a) { const k = INT((a - 2415021.076998695) / 29.530588853 + .5); let last, i = 1, arc = sl(nm(k + i)); do { last = arc; i++; arc = sl(nm(k + i)); } while (arc != last && i < 14); return i - 1; }\nfunction s2l(d, m, y) {\n  const dn = jd(d, m, y), k = INT((dn - 2415021.076998695) / 29.530588853); let ms = nm(k + 1); if (ms > dn) ms = nm(k);\n  let a = m11(y), b = a, ly; if (a >= ms) { ly = y; a = m11(y - 1); } else { ly = y + 1; b = m11(y + 1); }\n  const df = INT((ms - a) / 29); let lm = df + 11, lp = 0;\n  if (b - a > 365) { const lo = leapOff(a); if (df >= lo) { lm = df + 10; if (df == lo) lp = 1; } }\n  if (lm > 12) lm -= 12; if (lm >= 11 && df < 4) ly--; return [dn - ms + 1, lm, ly, lp];\n}\nfunction pd_(s) { return /^\\d{4}-\\d\\d-\\d\\d$/.test(s || '') ? [+s.slice(8), +s.slice(5, 7), +s.slice(0, 4)] : null; }\nfunction gioDM_(p) { if (p.gd && p.gm) return [+p.gd, +p.gm]; const x = pd_(p.d); if (!x) return null; const l = s2l(x[0], x[1], x[2]); return [l[0], l[1]]; }\n// ngày dương lịch cho ngày lunar (d, m) có phải là ngày giỗ g không (giỗ ngày 30 lùi về ngày 29 nếu tháng thiếu)\nfunction gioHit_(g, s) {\n  const l = s2l(s[0], s[1], s[2]); if (l[3] || l[1] != g[1]) return false;\n  if (l[0] == g[0]) return true;\n  if (g[0] == 30 && l[0] == 29) { const n = jdd(jd(s[0], s[1], s[2]) + 1), ln = s2l(n[0], n[1], n[2]); return ln[0] == 1; }\n  return false;\n}\nfunction leap_(y) { return new Date(Date.UTC(y, 2, 0)).getUTCDate() == 29; }\nfunction isDead_(p) { return !!(p.dead || p.d); }\n\n// ---- Sao lưu tự động trên Drive: mỗi ngày một bản (khi có thay đổi hoặc khi chạy nhắc việc), giữ 30 bản gần nhất ----\nconst BKFOLDER = 'giapha-saoluu', BKKEEP = 30;\nfunction bkFolder_() { const it = DriveApp.getFoldersByName(BKFOLDER); return it.hasNext() ? it.next() : DriveApp.createFolder(BKFOLDER); }\nfunction backup_(d, why) {\n  try {\n    const now = Date.now();\n    if (!why && d.lastBk && now - d.lastBk < 20 * 3600000) return false;\n    const f = bkFolder_(), stamp = new Date(now + 7 * 3600000).toISOString().replace(/[-:T]/g, '').slice(0, 14);\n    f.createFile('giapha-' + stamp + (why ? '-' + why : '') + '.json', JSON.stringify({ at: now, rev: d.rev, n: Object.keys(d.db.people).length, db: d.db, fund: d.fund || undefined }), 'application/json');\n    d.lastBk = now;\n    const all = []; const it = f.getFiles(); while (it.hasNext()) { const x = it.next(); all.push({ f: x, n: x.getName() }); }\n    all.sort((a, b) => a.n < b.n ? 1 : -1); all.slice(BKKEEP).forEach(x => x.f.setTrashed(true));\n    return true;\n  } catch (e) { return false; }\n}\nfunction bkList_() {\n  const out = [], it = bkFolder_().getFiles();\n  while (it.hasNext()) { const x = it.next(); out.push({ id: x.getId(), name: x.getName(), size: x.getSize() }); }\n  return out.sort((a, b) => a.name < b.name ? 1 : -1);\n}\n\n// ---- Email nhắc giỗ và sinh nhật: chạy hằng ngày lúc 7 giờ sau khi quản trị viên chạy hàm setupReminders một lần ----\nfunction rm_(d) { return Object.assign({ on: false, lead: 3, who: 'admin' }, d.remind || {}); }\nfunction remindLines_(d, T, off, label) {\n  const s = jdd(jd(T[0], T[1], T[2]) + off), out = [], P = d.db.people;\n  const dt = s[0] + '/' + s[1] + '/' + s[2], l = s2l(s[0], s[1], s[2]), lt = l[0] + '/' + l[1] + (l[3] ? ' nhuận' : '');\n  for (const k in P) {\n    const p = P[k], b = pd_(p.b);\n    if (b && !isDead_(p) && ((b[0] == s[0] && b[1] == s[1]) || (b[0] == 29 && b[1] == 2 && s[0] == 28 && s[1] == 2 && !leap_(s[2])))) out.push('- Sinh nhật ' + p.name + ' (tròn ' + (s[2] - b[2]) + ' tuổi)');\n    const g = gioDM_(p);\n    if (g && gioHit_(g, s)) { const y = +String(p.d || '').slice(0, 4); out.push('- Giỗ ' + p.name + (y ? ' (' + (s[2] - y) + ' năm)' : '')); }\n  }\n  return out.length ? [label + ': ' + dt + ' dương lịch, ' + lt + ' âm lịch'].concat(out) : [];\n}\nfunction daily_(nowMs, force) {\n  const lock = LockService.getScriptLock(); lock.waitLock(20000);\n  try {\n    const d = read_(), R = rm_(d), n = typeof nowMs == 'number' ? nowMs : Date.now();\n    let sent = 0;\n    if (R.on) {\n      const t = new Date(n + 7 * 3600000), T = [t.getUTCDate(), t.getUTCMonth() + 1, t.getUTCFullYear()], key = T[2] + '-' + T[1] + '-' + T[0];\n      if (d.lastRemind != key || force) {\n        const lines = remindLines_(d, T, 0, 'Hôm nay').concat(R.lead > 0 ? remindLines_(d, T, R.lead, 'Sau ' + R.lead + ' ngày') : []);\n        d.lastRemind = key;\n        if (lines.length) {\n          const to = [owner_()];\n          if (R.who == 'all') Object.keys(d.members || {}).forEach(e => { if (!(d.remindOff && d.remindOff[e])) to.push(e); });\n          if (d.remindOff && d.remindOff[owner_()]) to.shift();\n          const body = lines.join('\\n') + link_(nt_(d)) + '\\n\\nBạn có thể tắt email nhắc trong tab Cài đặt của ứng dụng.';\n          to.forEach(e => { mail_(e, 'Gia phả: nhắc giỗ, sinh nhật', body); sent++; });\n        }\n      }\n    }\n    backup_(d);\n    write_(d);\n    return sent;\n  } finally { lock.releaseLock(); }\n}\nfunction ensureTrigger_() {\n  if (!ScriptApp.getProjectTriggers().some(t => t.getHandlerFunction() == 'daily_')) ScriptApp.newTrigger('daily_').timeBased().everyDays(1).atHour(7).create();\n}\nfunction setupReminders() {\n  ScriptApp.getProjectTriggers().forEach(t => { if (t.getHandlerFunction() == 'daily_') ScriptApp.deleteTrigger(t); });\n  ScriptApp.newTrigger('daily_').timeBased().everyDays(1).atHour(7).create();\n}\n\n// ---- Liên kết chia sẻ một nhánh (xem không cần đăng nhập): chỉ trả tên, giới tính, năm sinh/mất và quan hệ, không có liên hệ, ghi chú, ảnh ----\nconst FILE_TYPES = ['application/pdf', 'image/jpeg', 'image/png', 'image/webp', 'audio/mpeg', 'audio/mp4', 'audio/x-m4a', 'audio/wav', 'video/mp4', 'text/plain'];\nconst FILE_FOLDER = 'giapha-tailieu', MAX_FILE = 8 * 1024 * 1024, ID_RE = /^[A-Za-z0-9_-]{4,40}$/;\nfunction fileFolder_() { const it = DriveApp.getFoldersByName(FILE_FOLDER); return it.hasNext() ? it.next() : DriveApp.createFolder(FILE_FOLDER); }\nfunction shareList_(d) { return Object.keys(d.shares || {}).map(k => Object.assign({ token: k }, d.shares[k])).sort((a, b) => b.at - a.at); }\nfunction shared_(q) {\n  const d = read_(), tk = String(q.token || ''), sh = /^[A-Za-z0-9]{8,64}$/.test(tk) && d.shares && d.shares[tk];\n  if (!sh || !d.db.people[sh.root]) return { err: 'Liên kết không còn hiệu lực' };\n  const P = d.db.people, set = {}, kidsOf = id => Object.keys(P).filter(k => P[k].fid == id || P[k].mid == id);\n  set[sh.root] = 1;\n  let fr = [sh.root];\n  for (let g = 1; fr.length && (!sh.depth || g < sh.depth); g++) {\n    const nx = [];\n    fr.forEach(id => {\n      const sp = spouses_(P[id]).filter(s => P[s]);\n      sp.forEach(s => { set[s] = 1; });\n      kidsOf(id).concat.apply([], sp.map(s => kidsOf(s).filter(k => { const o = P[k].fid == s ? P[k].mid : P[k].fid; return !o || o == id; }))).forEach(k => { if (!set[k]) { set[k] = 1; nx.push(k); } });\n    });\n    fr = nx;\n  }\n  Object.keys(set).forEach(id => spouses_(P[id]).forEach(s => { if (P[s]) set[s] = 1; }));\n  const out = {};\n  Object.keys(set).forEach(id => {\n    const p = P[id], dead = isDead_(p), keep = x => (x && set[x] && x != id) ? x : '';\n    out[id] = { id: id, name: p.name, g: p.g, dead: dead ? '1' : '', b: dead ? (p.b || '') : String(p.b || '').slice(0, 4), d: p.d || '', chi: p.chi || '', fid: keep(p.fid), mid: keep(p.mid), sid: keep(p.sid), xs: String(p.xs || '').split(',').filter(x => keep(x)).join(',') };\n  });\n  out[sh.root].fid = ''; out[sh.root].mid = '';\n  return { name: P[sh.root].name, depth: sh.depth || 0, people: out };\n}\n\n// ---- Quỹ họ, quỹ khuyến học, thành tích: lưu riêng trong d.fund, không nằm trong d.db nên không lọt vào liên kết chia sẻ nhánh ----\nconst BGK = ['none', 'giay', 'xanh', 'hong', 'la', 'troi', 'hoang', 'cham', 'luoi', 'img'];\nconst FRAMES = ['circle', 'oval', 'ovalh', 'rounded', 'square', 'portrait', 'landscape'];\nconst ACAT = ['hoc-tap', 'thi', 'tot-nghiep', 'nghe-nghiep', 'the-thao', 'van-nghe', 'khac'];\nconst SIDRE = /^[A-Za-z0-9_-]{1,40}$/;\nfunction fund_(d) { d.fund = d.fund || {}; d.fund.tx = d.fund.tx || []; d.fund.ach = d.fund.ach || []; return d.fund; }\nfunction dateOk_(s) { return /^\\d{4}(-\\d\\d(-\\d\\d)?)?$/.test(s || ''); }\nfunction cleanTx_(x, d) {\n  if (!x || !SIDRE.test(String(x.id || ''))) return null;\n  const amt = Math.round(+x.amt);\n  if (!(amt >= 1 && amt <= 1e12) || !/^\\d{4}-\\d\\d-\\d\\d$/.test(x.d || '')) return null;\n  return { id: x.id, f: x.f == 'kh' ? 'kh' : 'ho', t: x.t == 'chi' ? 'chi' : 'thu', d: x.d, pid: x.pid && d.db.people[x.pid] ? x.pid : '', who: String(x.who || '').slice(0, 100), amt: amt, note: String(x.note || '').slice(0, 300), ref: SIDRE.test(String(x.ref || '')) ? x.ref : '' };\n}\nfunction cleanAch_(x, d) {\n  if (!x || !SIDRE.test(String(x.id || '')) || !x.pid || !d.db.people[x.pid] || !dateOk_(x.d) || !String(x.title || '').trim()) return null;\n  return { id: x.id, pid: x.pid, d: x.d, k: ACAT.indexOf(x.k) >= 0 ? x.k : 'khac', title: String(x.title).trim().slice(0, 200), lv: String(Math.min(5, Math.max(0, parseInt(x.lv) || 0))), aw: Math.max(0, Math.min(1e12, Math.round(+x.aw) || 0)), note: String(x.note || '').slice(0, 500) };\n}\nfunction fundSee_(d, role, me, f) { return role == 'quan-tri' || !!(d.vis && d.vis[role] && d.vis[role][f] === true); }\n\nfunction owner_() { return Session.getEffectiveUser().getEmail().toLowerCase(); }\nfunction file_() {\n  const it = DriveApp.getFilesByName(FILE);\n  return it.hasNext() ? it.next() : DriveApp.createFile(FILE, JSON.stringify({ rev: 1, db: { people: {}, updated: 0 }, members: {}, queue: [] }), 'application/json');\n}\nfunction folder_() { const it = DriveApp.getFoldersByName(FOLDER); return it.hasNext() ? it.next() : DriveApp.createFolder(FOLDER); }\nfunction read_() { return JSON.parse(file_().getBlob().getDataAsString()); }\nfunction write_(d) { file_().setContent(JSON.stringify(d)); }\nfunction out_(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }\n\n// Xác thực mã đăng nhập Google (ID token) do trình duyệt gửi lên\nfunction who_(t) {\n  if (!t) return null;\n  const r = UrlFetchApp.fetch('https://oauth2.googleapis.com/tokeninfo?id_token=' + encodeURIComponent(t), { muteHttpExceptions: true });\n  if (r.getResponseCode() != 200) return null;\n  const j = JSON.parse(r.getContentText());\n  return j.aud == CLIENT_ID && String(j.email_verified) == 'true' ? String(j.email).toLowerCase() : null;\n}\n\nfunction doGet() { return out_({ ok: true, msg: 'Gia pha server' }); }\n\nfunction doPost(e) {\n  let q;\n  try { q = JSON.parse(e.postData.contents); } catch (x) { return out_({ err: 'Dữ liệu gửi lên không hợp lệ' }); }\n  if (q && q.a == 'ping') return out_({ ok: true, cid: CLIENT_ID, ver: 7 }); // trình cài đặt dùng để kiểm tra kết nối và Client ID\n  if (q && q.a == 'shared') return out_(shared_(q));\n  const me = who_(q.t);\n  if (!me) return out_({ err: 'auth' });\n  const lock = LockService.getScriptLock();\n  let got = false;\n  try { lock.waitLock(20000); got = true; return out_(run_(q, me)); }\n  catch (x) { return out_({ err: got ? String(x) : 'Máy chủ đang bận, hãy thử lại sau ít giây' }); }\n  finally { if (got) lock.releaseLock(); }\n}\n\nfunction spouses_(p) { return [p.sid].concat(String(p.xs || '').split(',')).map(i => String(i || '').trim()).filter((i, k, a) => i && a.indexOf(i) == k); }\nfunction apply_(db, x) {\n  const P = db.people;\n  if (x.op == 'del') {\n    delete P[x.pid];\n    for (const k in P) { for (const f of ['fid', 'mid', 'sid']) if (P[k][f] == x.pid) P[k][f] = ''; if (P[k].xs) P[k].xs = P[k].xs.split(',').filter(i => i && i != x.pid).join(','); }\n  } else {\n    P[x.pid] = Object.assign({}, P[x.pid] || {}, x.person, { id: x.pid }); // giữ nguyên ảnh và album đã có\n    ['fid', 'mid', 'sid'].forEach(f => { const r = P[x.pid][f]; if (r && (r == x.pid || !P[r])) P[x.pid][f] = ''; }); // người được trỏ tới có thể đã bị xoá từ lúc gửi đề xuất\n    const mine = spouses_(P[x.pid]).filter(i => P[i]);\n    P[x.pid].xs = (P[x.pid].xs || '').split(',').filter(i => i && P[i] && i != x.pid).join(',');\n    for (const k in P) { // người này là bản gốc: bỏ liên kết cũ không còn, thêm liên kết hai chiều mới\n      if (k == x.pid) continue;\n      const q = P[k], has = spouses_(q).indexOf(x.pid) >= 0;\n      if (has && mine.indexOf(k) < 0) { if (q.sid == x.pid) q.sid = ''; q.xs = (q.xs || '').split(',').filter(i => i && i != x.pid).join(','); }\n      if (!has && mine.indexOf(k) >= 0) { if (!q.sid) q.sid = x.pid; else q.xs = (q.xs ? q.xs + ',' : '') + x.pid; }\n    }\n  }\n  db.updated = Date.now();\n}\n\nfunction run_(q, me) {\n  const d = read_(), role = me == owner_() ? 'quan-tri' : d.members[me];\n  d.log = d.log || [];\n  if (!role) return { err: 'denied' };\n  const admin = role == 'quan-tri', A = q.a;\n  const contact = admin || !!(d.contact && d.contact[me]);\n\n  if (A == 'load') return { role: role, me: me, rev: d.rev, db: contact ? d.db : strip_(d.db), queue: admin ? d.queue : d.queue.filter(x => x.by == me), members: admin ? d.members : undefined, contact: admin ? (d.contact || {}) : undefined, vis: d.vis || {}, frame: d.frame || 'circle', bg: d.bg || {}, defaults: admin ? (d.defaults || { role: 'de-xuat', contact: false, export: false }) : undefined, notify: admin ? nt_(d) : undefined, remind: admin ? rm_(d) : undefined, shares: admin ? shareList_(d) : undefined, remindMe: !(d.remindOff && d.remindOff[me]), owner: me == owner_(), exports: admin ? (d.exports || {}) : undefined, perm: { propose: role != 'xem', contact: contact, export: admin || !!(d.exports && d.exports[me]) } };\n\n  if (A == 'getImg') {\n    const it = folder_().getFilesByName(q.id + '.jpg');\n    return it.hasNext() ? { data: Utilities.base64Encode(it.next().getBlob().getBytes()) } : { err: 'Không thấy ảnh' };\n  }\n\n  if (A == 'getFile') {\n    if (!ID_RE.test(String(q.id || ''))) return { err: 'Tệp không hợp lệ' };\n    const it = fileFolder_().getFilesByName(String(q.id));\n    if (!it.hasNext()) return { err: 'Không thấy tệp' };\n    const b = it.next().getBlob();\n    return { data: Utilities.base64Encode(b.getBytes()), mime: b.getContentType() };\n  }\n\n  if (A == 'propose') {\n    if (role != 'de-xuat' && !admin) return { err: 'denied' };\n    if (['add', 'edit', 'del'].indexOf(q.op) < 0 || !q.pid || String(q.pid).length > 64 || (q.op == 'add' && !PID_RE.test(String(q.pid)))) return { err: 'Đề xuất không hợp lệ' };\n    if (!admin && d.queue.filter(x => x.by == me && x   }catch(e){bad('Không kết nối được. Kiểm tra địa chỉ /exec và mục Who has access phải là Anyone, rồi Deploy lại.')}}

/* ---------- Phả đồ khổ lớn: khung, tiêu đề họ, một tờ lớn hoặc tách nhiều tờ để ghép ---------- */
const PAPER={A4:[210,297],A3:[297,420],A2:[420,594],A1:[594,841],A0:[841,1189]},MMPX=96/25.4,MAXTILE=64;
const rootP=()=>{const ps=Object.values(P());return P()[localStorage.gpr]||ps.find(p=>!p.fid&&!p.mid&&kids(p.id).length)||ps[0]};
const defTitle=()=>{if(localStorage.gptitle!=null)return localStorage.gptitle;const r=rootP();return r?'Gia phả họ '+String(r.name).split(' ')[0]:'Gia phả'};
function treeFull(){

  const el=document.createElement('div');el.className='poster fr-'+o.frame;
  const tw=tree.scrollWidth||800,f=Math.min(3,Math.max(1,tw/1500)),r=rootP();
  const sub=o.sub!=null&&o.sub!==''?o.sub:'';

    <div class="ptt"><h1 style="font-size:${Math.round(46*f)}px">${esc(o.title||'Gia phả')}</h1>${sub?`<div class="sub" style="font-size:${Math.round(22*f)}px">${esc(sub)}</div>`:''}<div class="orn" style="font-size:${Math.round(22*f)}px">❖</div></div>
    <div class="ptr"><div class="tree">${tree.innerHTML}</div></div>
    <div class="pft">${chips.length?chips.map(c=>`<span class="lg"><i style="background:${esc(c.c)}"></i>${esc(c.t)}</span>`).join(''):''}<div>Thẻ nét liền: còn sống. Thẻ nét đứt: đã mất. Màu viền trên thẻ là màu nhánh.</div><div>Lập ngày ${new Date().toLocaleDateString('vi-VN')}${r?', gốc: '+esc(r.name):''}</div></div>`;

function ppPlan(o,pos){
  const [a,b]=PAPER[o.paper],W=o.land?b:a,H=o.land?a:b,tile=o.mode=='tile',m=tile?10:(o.paper=='A4'?8:12),uw=W-2*m,uh=H-2*m,ov=tile?10:0,sw=uw-ov,sh=uh-ov;
  let s,cols=1,rows=1;
  if(!tile)s=Math.min(4,uw*MMPX/pos.w,uh*MMPX/pos.h);
  else{s=+o.cols>0?(o.cols*sw+ov)*MMPX/pos.w:1;cols=Math.max(1,Math.ceil((pos.w*s/MMPX-ov)/sw-1e-9));rows=Math.max(1,Math.ceil((pos.h*s/MMPX-ov)/sh-1e-9))}
  return {W,H,m,uw,uh,ov,sw,sh,s,cols,rows,tile,fw:pos.w*s/MMPX,fh:pos.h*s/MMPX,card:112*s/MMPX}}

document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t){e.preventDefault();A[t.dataset.a](t.dataset.i)}});
/* ---------- Quỹ họ, quỹ khuyến học, thành tích ---------- */
const FUNDN={ho:'Quỹ họ',kh:'Quỹ khuyến học'};
const ACATN={'hoc-tap':'Học tập','thi':'Thi cử, tuyển sinh','tot-nghiep':'Tốt nghiệp','nghe-nghiep':'Công tác, nghề nghiệp','the-thao':'Thể thao','van-nghe':'Văn nghệ','khac':'Khác'};
const LVN=['Gia đình, dòng họ','Trường','Huyện, quận','Tỉnh, thành phố','Quốc gia','Quốc tế'];
let fund={tx:[],ach:[]},fundOk=false,fundErr=false,fsub='tong',ach_sub='ds',ffq='all',ffy='all',afc='all',afy='all',fundBusy=false;
const vnd=n=>(Math.round(+n)||0).toLocaleString('vi-VN')+' đ';
const todayS=()=>{const t=new Date();return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate())};
const vnd2=s=>{const x=pd(s);return x?pad(x[0])+'/'+pad(x[1])+'/'+x[2]:(s||'')};
const dmy=s=>{const m=String(s||'').match(/^(\d{4})(?:-(\d\d)(?:-(\d\d))?)?$/);return m?(m[3]?m[3]+'/':'')+(m[2]?m[2]+'/':'')+m[1]:String(s||'')};
function parseAmt(s){s=norm(String(s||'')).replace(/\s/g,'');const m=s.match(/^([\d.,]+)(k|nghin|tr|trieu|ty)?$/);if(!m)return 0;
  const u=m[2],n=u?parseFloat(m[1].replace(',','.')):parseInt(m[1].replace(/[.,]/g,''),10);
  return Math.round(n*(u=='k'||u=='nghin'?1e3:u=='tr'||u=='trieu'?1e6:u=='ty'?1e9:1))||0}
const SIDF=/^[A-Za-z0-9_-]{1,40}$/;
function fcTx(x){if(!x||!SIDF.test(String(x.id||'')))return null;const amt=Math.round(+x.amt);if(!(amt>=1&&amt<=1e12)||!/^\d{4}-\d\d-\d\d$/.test(x.d||''))return null;
  return {id:x.id,f:x.f=='kh'?'kh':'ho',t:x.t=='chi'?'chi':'thu',d:x.d,pid:x.pid&&P()[x.pid]?x.pid:'',who:String(x.who||'').slice(0,100),amt,note:String(x.note||'').slice(0,300),ref:SIDF.test(String(x.ref||''))?x.ref:''}}
function fcAch(x){if(!x||!SIDF.test(String(x.id||''))||!x.pid||!P()[x.pid]||!okDate(x.d||'')||!x.d||!String(x.title||'').trim())return null;
  return {id:x.id,pid:x.pid,d:x.d,k:ACATN[x.k]?x.k:'khac',title:String(x.title).trim().slice(0,200),lv:String(Math.min(5,Math.max(0,parseInt(x.lv)||0))),aw:Math.max(0,Math.min(1e12,Math.round(+x.aw)||0)),note:String(x.note||'').slice(0,500)}}
function fundLocalLoad(){try{const f=JSON.parse(localStorage.gpfund||'{}');fund={tx:(f.tx||[]).map(fcTx).filter(Boolean),ach:(f.ach||[]).map(fcAch).filter(Boolean)}}catch(e){fund={tx:[],ach:[]}}fundOk=true}
const fundLocalSave=()=>{try{localStorage.gpfund=JSON.stringify(fund)}catch(e){}};
async function loadFund(){
  await 0; // luôn chạy sau khi giao diện hiện tại dựng xong, tránh dựng lồng nhau
  if(role=='local'){fundLocalLoad();if(v=='fund'||v=='ach')render();return}
  if(offline){try{const c=JSON.parse(localStorage.gpfundc);fund={tx:c.tx||[],ach:c.ach||[]};fundOk=true}catch(e){fundErr=true}if(v=='fund'||v=='ach')render();return}
  if(!idt||offline||!SRV()||!(can('fund')||can('ach'))){fundErr=true;return}
  try{const r=await api('fundLoad');if(r.err){fundErr=true;return}fund={tx:r.tx||[],ach:r.ach||[]};fundOk=true;fundErr=false;try{localStorage.gpfundc=JSON.stringify(fund)}catch(e){}if(v=='fund'||v=='ach')render()}catch(e){fundErr=true}}
function fundApply(op){
  if(op.o=='set'){fund={tx:((op.f||{}).tx||[]).map(fcTx).filter(Boolean),ach:((op.f||{}).ach||[]).map(fcAch).filter(Boolean)};return}
  const L=fund[op.k];if(!L)return;
  if(op.o=='del'){const id=String(op.i);fund[op.k]=L.filter(z=>z.id!=id);if(op.k=='ach')fund.tx=fund.tx.filter(z=>z.ref!=id);return}
  const it=(op.k=='tx'?fcTx:fcAch)(op.i);if(!it)return;const j=L.findIndex(z=>z.id==it.id);if(j>=0)L[j]=it;else L.push(it)}
async function fundOps(ops){
  if(!canEdit()){msg('Bạn không có quyền sửa quỹ và thành tích');return false}
  if(role=='local'){ops.forEach(fundApply);fundLocalSave();render();return true}
  try{let r;for(let i=0;i<ops.length||!i;i+=400){r=await api('fundOp',{ops:ops.slice(i,i+400)});if(r.err){msg(r.err);return false}}fund={tx:r.tx||[],ach:r.ach||[]};fundOk=true;render();return true}
  catch(e){if(!e||e.err!='auth')fail(e);return false}}

/* Gia đình = hộ: người có vợ/chồng thì tính theo chồng (hoặc người chính của cặp), người chưa có thì tự là một hộ */
function famHead(id){const p=P()[id];if(!p)return '';const sp=spo(p);if(!sp.length||p.g=='m')return id;const m=sp.find(s=>s.g=='m');return m?m.id:id}
function famName(h){const p=P()[h];if(!p)return '(đã xoá)';const s=spo(p).filter(x=>x.g!=p.g)[0];return 'Gia đình '+p.name+(s?' và '+s.name:'')}
const personLbl=(pid,who)=>pid&&P()[pid]?P()[pid].name:pid?'(người đã xoá khỏi gia phả)':(who?who+' (ngoài danh sách)':'Không rõ');
const fyears=()=>[...new Set([...fund.tx.map(x=>x.d.slice(0,4)),...fund.ach.map(x=>String(x.d).slice(0,4))].filter(Boolean))].sort().reverse();
const ftx=()=>fund.tx.filter(x=>(ffq=='all'||x.f==ffq)&&(ffy=='all'||x.d.slice(0,4)==ffy));
const sumT=(a,t)=>a.filter(x=>x.t==t).reduce((s,x)=>s+x.amt,0);
const balOf=f=>{const a=fund.tx.filter(x=>x.f==f);return sumT(a,'thu')-sumT(a,'chi')};
function grp(a,keyf,labf){const m=new Map();
  for(const x of a.filter(z=>z.t=='thu')){const k=keyf(x);let g=m.get(k);if(!g){g={k,label:labf(k,x),tot:0,n:0,last:'',ho:0,kh:0,items:[]};m.set(k,g)}g.tot+=x.amt;g[x.f]+=x.amt;g.n++;g.items.push(x);if(x.d>g.last)g.last=x.d}
  return [...m.values()].sort((a,b)=>b.tot-a.tot||a.label.localeCompare(b.label,'vi'))}
const byMem=a=>grp(a,x=>x.pid&&P()[x.pid]?x.pid:'w:'+norm(x.who||'khong ro'),(k,x)=>personLbl(x.pid,x.who));
const byFam=a=>grp(a,x=>x.pid&&P()[x.pid]?famHead(x.pid):'w:'+norm(x.who||'khong ro'),(k,x)=>x.pid&&P()[x.pid]?famName(k):personLbl('',x.who));
const optYears=(cur)=>`<option value="all"${cur=='all'?' selected':''}>Mọi năm</option>`+fyears().map(y=>`<option${y==cur?' selected':''}>${y}</option>`).join('');
const frow=(l,sub,r,attr,cls)=>`<div class="row"${attr?' '+attr:' style="cursor:default"'}><div style="flex:1"><b>${l}</b>${sub?`<small>${sub}</small>`:''}</div><div style="text-align:right;white-space:nowrap" class="${cls||''}">${r}</div></div>`;

function fundGuard(){if(fundOk)return '';if(fundErr)return '<p class="empty">Không tải được dữ liệu quỹ. Hãy kiểm tra mạng rồi bấm tải lại trang.</p>';if(!fundBusy){fundBusy=true;loadFund().finally(()=>{fundBusy=false})}return '<p class="empty">Đang tải…</p>'}

    if(fsub=='gd'&&ffy!='all'){const paid=new Set(gs.map(x=>x.k)),no=[...new Set(Object.values(P()).filter(p=>!isD(p)).map(p=>famHead(p.id)))].filter(k=>P()[k]&&!paid.has(k));
      if(no.length)h+=`<h2>Chưa đóng trong năm ${ffy} (${no.length})</h2>`+no.sort((x,y)=>P()[x].name.localeCompare(P()[y].name,'vi')).map(k=>frow(esc(famName(k)),'',vnd(0),`data-a="view" data-i="${k}"`)).join('')}}

async function fsave(id){
  const old=fund.tx.find(z=>z.id==id)||{},d=nd($('#fxd').value),amt=parseAmt($('#fxa').value);
  if(!/^\d{4}-\d\d-\d\d$/.test(d)||!okDate(d))return alert('Ngày không hợp lệ, hãy nhập dd/mm/yyyy.');

  const it=fcTx({...old,id:id||uid()+uid(),t:$('#fxt').value,f:$('#fxf').value,d,pid:$('#fxp').value,who:$('#fxw').value.trim(),amt,note:$('#fxn').value.trim(),ref:old.ref||''});

/* ---------- Khung ảnh đại diện, cắt và chỉnh ảnh ---------- */
const FRS={circle:'Hình tròn',oval:'Ô van đứng',ovalh:'Ô van ngang',rounded:'Vuông bo góc',square:'Hình vuông',portrait:'Chữ nhật đứng',landscape:'Chữ nhật ngang'};
const FRA={circle:1,rounded:1,square:1,oval:.75,portrait:.75,ovalh:4/3,landscape:4/3};
let frameDef=(()=>{try{const x=localStorage.gpfrg;return FRS[x]?x:'circle'}catch(e){return 'circle'}})(),formPh=null,formP=null,crop=null;
const frOf=p=>p&&FRS[p.fr]?p.fr:frameDef;
const frOpts=cur=>`<option value="">Theo mặc định chung (${FRS[frameDef]})</option>`+Object.entries(FRS).map(([k,t])=>`<option value="${k}"${cur==k?' selected':''}>${t}</option>`).join('');
function shapePath(x,w,h,f){x.moveTo(0,0);
  if(f=='circle'||f=='oval'||f=='ovalh'){x.moveTo(w-1,h/2);x.ellipse(w/2,h/2,w/2-1,h/2-1,0,0,Math.PI*2);return}
  const r=f=='rounded'?Math.min(w,h)*.22:f=='square'?0:Math.min(w,h)*.08;
  x.moveTo(r,1);x.arcTo(w-1,1,w-1,h-1,r);x.arcTo(w-1,h-1,1,h-1,r);x.arcTo(1,h-1,1,1,r);x.arcTo(1,1,w-1,1,r);x.closePath()}
const cropEff=()=>crop.cur||frameDef;
function cropSize(){const ar=FRA[cropEff()];return ar>=1?[280,Math.round(280/ar)]:[Math.round(280*ar),280]}
function cropSrc(){const c=crop,b=c.base,r=c.rot%2,w=r?b.height:b.width,h=r?b.width:b.height,s=document.createElement('canvas');s.width=w;s.height=h;
  const x=s.getContext('2d');x.translate(w/2,h/2);x.rotate(c.rot*Math.PI/2);if(c.flip)x.scale(-1,1);x.drawImage(b,-b.width/2,-b.height/2);c.src=s}
function cropDraw(cv,vw,vh,q,preview){
  const c=crop,s=c.src,cov=Math.max(vw/s.width,vh/s.height),k=cov*c.zoom,dw=s.width*k,dh=s.height*k,mx=Math.max(0,(dw-vw)/2),my=Math.max(0,(dh-vh)/2);
  c.ox=Math.max(-mx,Math.min(mx,c.ox));c.oy=Math.max(-my,Math.min(my,c.oy));
  const x=cv.getContext('2d');x.setTransform(q,0,0,q,0,0);x.fillStyle='#fff';x.fillRect(0,0,vw,vh);x.drawImage(s,vw/2+c.ox-dw/2,vh/2+c.oy-dh/2,dw,dh);
  if(c.br||c.ct){x.setTransform(1,0,0,1,0,0);const id=x.getImageData(0,0,cv.width,cv.height),d=id.data,f=(259*(c.ct+255))/(255*(259-c.ct)),b=c.br*2.55,cl=v=>v<0?0:v>255?255:v;
    for(let i=0;i<d.length;i+=4){d[i]=cl(f*(d[i]-128)+128+b);d[i+1]=cl(f*(d[i+1]-128)+128+b);d[i+2]=cl(f*(d[i+2]-128)+128+b)}x.putImageData(id,0,0);x.setTransform(q,0,0,q,0,0)}
  if(preview){x.fillStyle='rgba(0,0,0,.5)';x.beginPath();x.rect(0,0,vw,vh);shapePath(x,vw,vh,cropEff());x.fill('evenodd');
    x.strokeStyle='#fff';x.lineWidth=1.5;x.beginPath();shapePath(x,vw,vh,cropEff());x.stroke()}}
function cropRedraw(){const cv=$('#crc');if(!cv||!crop)return;const [w,h]=cropSize();if(cv.width!=w||cv.height!=h){cv.width=w;cv.height=h}cropDraw(cv,w,h,1,true)}
function openCrop(url,o){
  const im=new Image();im.onerror=()=>msg('Không đọc được ảnh này');
  im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),b=document.createElement('canvas');b.width=Math.round(im.width*k);b.height=Math.round(im.height*k);b.getContext('2d').drawImage(im,0,0,b.width,b.height);
    crop={base:b,rot:0,flip:false,zoom:1,ox:0,oy:0,br:0,ct:0,pick:!!o.pick,cur:o.cur||'',done:o.done,cancel:o.cancel,ok:false};cropSrc();
    let d=$('#crd');if(!d){d=document.createElement('dialog');d.id='crd';document.body.appendChild(d);
      d.addEventListener('close',()=>{if(crop&&!crop.ok&&crop.cancel)crop.cancel();crop=null})}
    const [w,h]=cropSize();
    d.innerHTML=`<h2>Cắt và chỉnh ảnh</h2><small style="margin-bottom:6px">Kéo ảnh để chọn vị trí, kéo thanh để phóng to. Phần tối nằm ngoài khung nên sẽ bị cắt.</small>
    <div style="display:grid;place-items:center;margin:8px 0"><canvas id="crc" width="${w}" height="${h}" style="touch-action:none;cursor:grab;background:#fff;max-width:100%;border-radius:6px"></canvas></div>
    <label>Phóng to<input id="crz" type="range" min="1" max="4" step="0.01" value="1"></label>
    <label>Độ sáng<input id="crb" type="range" min="-50" max="50" step="1" value="0"></label>
    <label>Độ tương phản<input id="crt" type="range" min="-50" max="50" step="1" value="0"></label>
    <div class="act" style="margin-top:6px"><button data-a="crrl">Xoay trái</button><button data-a="crrr">Xoay phải</button><button data-a="crfl">Lật ngang</button><button data-a="crrs">Đặt lại</button></div>
    ${crop.pick?`<label>Khung ảnh của người này<select id="crf">${frOpts(crop.cur)}</select></label>`:`<small>Khung đang dùng: ${FRS[frameDef]} (do quản trị viên chọn).</small>`}
    <div class="act"><button class="pr" data-a="crok">Dùng ảnh này</button><button data-a="crno">Huỷ</button></div>`;
    if(!d.open)d.showModal();cropRedraw();
    const cv=$('#crc');let drag=null;
    cv.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'});
    cv.addEventListener('pointermove',e=>{if(!drag||!crop)return;crop.ox+=e.clientX-drag[0];crop.oy+=e.clientY-drag[1];drag=[e.clientX,e.clientY];cropRedraw()});
    const up=()=>{drag=null;cv.style.cursor='grab'};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
    cv.addEventListener('wheel',e=>{e.preventDefault();const z=$('#crz');z.value=Math.max(1,Math.min(4,+z.value+(e.deltaY<0?.1:-.1)));crop.zoom=+z.value;cropRedraw()},{passive:false})};

const GM=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const gdt=s=>{const m=String(s||'').match(/^(\d{4})(?:-(\d\d)(?:-(\d\d))?)?$/);return m?[m[3]&&+m[3],m[2]&&GM[+m[2]-1],m[1]].filter(Boolean).join(' '):''};
function ged(){
  const ps=Object.values(P()),F={},o=['0 HEAD','1 GEDC','2 VERS 5.5.1','1 CHAR UTF-8'];
  const fk=(a,b)=>[a||'',b||''].sort().join('|');
  const fam=k=>F[k]||(F[k]={id:'F'+(Object.keys(F).length+1),m:[],c:[]});
  ps.forEach(p=>{
    for(const sd of spIds(p)){const f=fam(fk(p.id,sd));[p.id,sd].forEach(x=>f.m.includes(x)||f.m.push(x))}
    if(p.fid||p.mid){const f=fam(fk(p.fid,p.mid));[p.fid,p.mid].forEach(x=>x&&!f.m.includes(x)&&f.m.push(x));f.c.push(p.id)}});
  ps.forEach(p=>{
    o.push(`0 @${p.id}@ INDI`,`1 NAME ${p.name}`,`1 SEX ${p.g=='f'?'F':'M'}`);
    if(gdt(p.b))o.push('1 BIRT','2 DATE '+gdt(p.b));if(isD(p))o.push('1 DEAT',...(gdt(p.d)?['2 DATE '+gdt(p.d)]:[]));
    for(const f of Object.values(F)){if(f.c.includes(p.id))o.push(`1 FAMC @${f.id}@`);if(f.m.includes(p.id))o.push(`1 FAMS @${f.id}@`)}});
  for(const f of Object.values(F)){o.push(`0 @${f.id}@ FAM`);f.m.forEach(x=>o.push(`1 ${P()[x].g=='f'?'WIFE':'HUSB'} @${x}@`));f.c.forEach(x=>o.push(`1 CHIL @${x}@`))}
  return o.concat('0 TRLR').join('\n');
}

    const lk=(a,b)=>{if(!a||!b)return;for(const [x,y] of [[a,b],[b,a]]){const cur=[x.sid,...String(x.xs||'').split(',')].filter(Boolean);if(cur.includes(y.id))continue;if(!x.sid)x.sid=y.id;else x.xs=[...String(x.xs||'').split(',').filter(Boolean),y.id].join(',')}};
    lk(h,w);
    for(const c of r.ch.filter(x=>x.tag=='CHIL')){const k=map[c.val];if(!k)continue;if(h&&!k.fid)k.fid=h.id;if(w&&!k.mid)k.mid=w.id;if(h&&h.g=='f'&&!k.mid){k.mid=h.id;k.fid=''}}}
  return {people,fams}}
function gedImport(file){
  if(!canEdit())return msg('Bạn không có quyền nhập dữ liệu');
  file.text().then(t=>{
    const r=gedParse(t);if(!r.people.length)return msg('Không thấy người nào trong tệp GEDCOM (tệp cần mã hoá UTF-8)');
    if(!confirm(`Tìm thấy ${r.people.length} người, ${r.fams} gia đình. Thêm tất cả vào gia phả? (Người trùng sẽ được gợi ý gộp ở mục “Tìm người trùng”.)`))return;
    for(const p of r.people)P()[p.id]=p;
    save();msg(`Đã nhập ${r.people.length} người từ GEDCOM`)}).catch(()=>msg('Không đọc được tệp'))}

/* ---------- Tìm người trùng và gộp ---------- */
const pairKey=(a,b)=>[a.id,b.id].sort().join(':');
function dupPairs(){
  const ps=Object.values(P()),by={},out=[],ig=(()=>{try{return new Set(JSON.parse(localStorage.gpnd||'[]'))}catch(e){return new Set()}})();
  for(const p of ps)(by[norm(p.name).replace(/\s+/g,' ')+'|'+p.g]=by[norm(p.name).replace(/\s+/g,' ')+'|'+p.g]||[]).push(p);
  for(const k in by){const l=by[k];for(let i=0;i<l.length;i++)for(let j=i+1;j<l.length;j++){const a=l[i],b=l[j],ya=+yr(a.b),yb=+yr(b.b);
    if(ya&&yb&&Math.abs(ya-yb)>1)continue;if(ig.has(pairKey(a,b)))continue;if(spIds(a).includes(b.id))continue;
    if(ancs(a.id).has(b.id)||ancs(b.id).has(a.id))continue;
    out.push([a,b,ya&&yb&&ya==yb?'cùng tên và năm sinh':'cùng tên'])}}
  return out.slice(0,200)}
function mergeP(keepId,dropId){
  const k=P()[keepId],d=P()[dropId];if(!k||!d||k==d)return false;
  if(ancs(keepId).has(dropId)||ancs(dropId).has(keepId))return false;
  for(const f in d){if(f=='id'||f=='al'||f=='xs')continue;if(!k[f]&&d[f])k[f]=d[f]}
  if(d.al&&d.al.length)k.al=[...(k.al||[]),...d.al];
  for(const q of Object.values(P())){if(q==d)continue;
    for(const f of ['fid','mid','sid'])if(q[f]==dropId)q[f]=keepId==q.id?'':keepId;
    if(q.xs)q.xs=[...new Set(q.xs.split(',').map(x=>x==dropId?keepId:x).filter(x=>x&&x!=q.id))].join(',')}
  k.xs=[...new Set([...String(k.xs||'').split(','),...String(d.xs||'').split(',')].filter(x=>x&&x!=keepId&&x!=dropId))].join(',');
  if(k.sid==keepId)k.sid='';if(k.fid==keepId)k.fid='';if(k.mid==keepId)k.mid='';
  if(k.xs.split(',').includes(k.sid))k.xs=k.xs.split(',').filter(x=>x!=k.sid).join(',');
  delete P()[dropId];normSp();return true}
function vDup(){
  const l=dupPairs(),card=p=>`<div style="flex:1;min-width:0"><b>${esc(p.name)}</b><small>${[life(p),esc(p.pl)].filter(Boolean).join(', ')||'Chưa có ngày sinh'}</small><small>Cha: ${esc((P()[p.fid]||{}).name||'không rõ')}; Mẹ: ${esc((P()[p.mid]||{}).name||'không rõ')}</small><small>${kids(p.id).length} con</small></div>`;
  return `<div class="bar noprint"><button data-a="tab" data-i="set">‹ Dữ liệu</button></div><h2>Tìm người trùng (${l.length})</h2>
  <small style="margin-bottom:8px">Gợi ý các cặp cùng tên, giới tính và năm sinh gần nhau. Khi gộp, thông tin còn thiếu của người được giữ sẽ lấy từ người kia, mọi quan hệ cha mẹ, con, vợ chồng và ảnh được chuyển sang người được giữ.</small>`
  +(l.map(([a,b,w])=>`<div class="row" style="cursor:default;flex-wrap:wrap;align-items:flex-start"><div style="flex:1 1 100%"><span class="tag">${w}</span></div>${card(a)}${card(b)}
    <div class="act" style="flex:1 1 100%;margin:4px 0 0"><button data-a="mrg" data-i="${a.id}:${b.id}">Giữ ${esc(a.name.split(' ').slice(-1)[0])} (trái)</button><button data-a="mrg" data-i="${b.id}:${a.id}">Giữ bên phải</button><button data-a="nodup" data-i="${pairKey(a,b)}">Không trùng</button></div></div>`).join('')||'<p class="empty">Không phát hiện cặp nào có thể trùng.</p>')}

/* ---------- Gộp thay đổi khi hai quản trị viên sửa cùng lúc ---------- */
function merge3(b,l,sv){
  const B=b.people||{},L=l.people||{},S=sv.people||{},out={people:{},updated:Date.now()};let conf=0;
  for(const id of new Set([...Object.keys(B),...Object.keys(L),...Object.keys(S)])){
    const bb=B[id],ll=L[id],ss=S[id],js=JSON.stringify,lch=js(ll)!=js(bb),sch=js(ss)!=js(bb);
    if(!lch){if(ss)out.people[id]=ss;continue}
    if(!sch){if(ll)out.people[id]=ll;continue}
    if(!ll||!ss){out.people[id]=ll||ss;conf++;continue}
    const m={...ss};
    for(const k of new Set([...Object.keys(ll),...Object.keys(ss),...Object.keys(bb||{})])){
      const lv=js(ll[k]),svv=js(ss[k]),bv=js((bb||{})[k]);
      if(lv!=bv&&svv==bv){if(ll[k]===undefined)delete m[k];else m[k]=ll[k]}
      else if(lv!=bv&&svv!=bv&&lv!=svv){conf++;if(ll[k]===undefined)delete m[k];else m[k]=ll[k]}}
    out.people[id]=m}
  for(const p of Object.values(out.people)){for(const f of ['fid','mid','sid'])if(p[f]&&!out.people[p[f]])p[f]='';if(p.xs)p.xs=p.xs.split(',').filter(x=>x&&x!=p.id&&out.people[x]).join(',')}
  return {db:out,conf}}

/* ---------- Máy chủ (Google Apps Script, dữ liệu nằm trong Drive của quản trị viên) ---------- */
const fail=e=>{console.error(e);msg(e&&e.err=='denied'?'Bạn không có quyền thực hiện thao tác này':'Lỗi kết nối máy chủ, thử lại sau')};
async function api(a,x={}){
  const r=await fetch(SRV(),{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({t:idt,a,...x})});
  const j=await r.json();
  if(j.err=='auth'){idt='';sessionStorage.removeItem('gpt');role='';deny='Phiên đăng nhập đã hết hạn, hãy đăng nhập lại.';render();throw j}
  return j}
async function boot(){
  try{const r=await api('load');
    if(r.err=='denied'){role='';deny='Tài khoản '+jwtMail()+' chưa được quản trị viên mời. Hãy nhờ quản trị viên thêm email này.';return render()}
    if(r.err){role='';deny='Lỗi: '+r.err;return render()}
    const local=db;role=r.role;me=r.me;rev=r.rev;db=r.db;snap0=JSON.stringify(r.db);queue=r.queue||[];members=r.members||{};contact=r.contact||{};exportMap=r.exports||{};perm=r.perm||{};if(r.notify)notify=r.notify;vmap=r.vis||{};if(r.frame&&FRS[r.frame]){frameDef=r.frame;try{localStorage.gpfrg=frameDef}catch(e){}}bgc=r.bg&&typeof r.bg=='object'?r.bg:{};try{localStorage.gpbg=JSON.stringify(bgc)}catch(e){}if(r.defaults)defs=r.defaults;if(r.remind)remind=r.remind;shares=r.shares||[];remindMe=r.remindMe!==false;isOwner=!!r.owner;
    if(role=='quan-tri'&&!Object.keys(db.people).length&&Object.keys(local.people).length&&confirm('Máy chủ còn trống. Đưa '+Object.keys(local.people).length+' người đang có trên máy này lên máy chủ?')){db=local;await pushNow()}
    if(role=='quan-tri'&&localStorage.gpdirty&&(local.updated||0)>(db.updated||0)&&Object.keys(local.people).length){
      if(confirm('Máy này có thay đổi chưa được lưu lên máy chủ (do mất mạng hoặc phiên đăng nhập hết hạn).\n\nOK: dùng bản trên máy này và lưu lên máy chủ (ghi đè bản trên máy chủ).\nHuỷ: bỏ thay đổi này và dùng bản trên máy chủ.')){db=local;await pushNow()}else localStorage.removeItem('gpdirty')}
    else localStorage.removeItem('gpdirty');
    localStorage.gp=JSON.stringify(db);localStorage.gprole=role;try{localStorage.gpvis=JSON.stringify(vmap)}catch(e){}offline=false;render();if(role=='quan-tri')flushImgs().catch(fail);wzResume();loadFund().catch(()=>{})
  }catch(e){if(e&&e.err=='auth')return;if(localStorage.gprole){role='xem';offline=true;try{db=JSON.parse(localStorage.gp)}catch(x){}try{vmap=JSON.parse(localStorage.gpvis||'{}')}catch(x){}render()}else fail(e)}}
async function memOp(x){
  try{const r=await api('member',x);if(r.err){msg('Không lưu được phân quyền: '+r.err);return boot()}members=r.members;contact=r.contact;exportMap=r.exports||{};render();msg('Đã lưu phân quyền')}catch(e){if(!e||e.err!='auth')fail(e)}}
async function pushNow(tries=0){
  msg('Đang lưu…');const r=await api('save',{rev,db});
  if(r.err=='conflict'){
    if(!snap0||tries>=3){msg('Dữ liệu vừa được thay đổi ở nơi khác, đang tải lại…');return boot()}
    const sv=await api('load');if(sv.err||!sv.db){msg('Dữ liệu vừa được thay đổi ở nơi khác, đang tải lại…');return boot()}
    const mg=merge3(JSON.parse(snap0),db,sv.db);db=mg.db;rev=sv.rev;queue=sv.queue||queue;snap0=JSON.stringify(sv.db);normSp();localStorage.gp=JSON.stringify(db);render();
    await pushNow(tries+1);if(mg.conf)msg(`Đã gộp thay đổi của người khác với bản của bạn (${mg.conf} chỗ khác nhau, ưu tiên bản của bạn)`);return}
  if(r.err)throw r;rev=r.rev;snap0=JSON.stringify(db);localStorage.removeItem('gpdirty');msg('Đã lưu vào Drive của quản trị viên')}
function drivePush(){if(role!='quan-tri'||!idt)return;clearTimeout(pt);pt=setTimeout(()=>pushNow().then(flushImgs).catch(fail),1200)}

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();inst=e;if(v=='set')render()});
window.addEventListener('online',()=>{if(offline)location.reload()});
if('serviceWorker' in navigator&&location.protocol.indexOf('http')==0)navigator.serviceWorker.register('sw.js').catch(()=>{});
if(SHARE){api('shared',{token:SHARE.t}).then(r=>{if(r.err){role='';deny=r.err;return render()}db={people:r.people,updated:0};shareName=r.name;render()}).catch(()=>{role='';deny='Không tải được bản chia sẻ, hãy thử lại sau.';render()})}
else{if(role=='local')fundLocalLoad();render();msg();if(SRV()&&idt)boot();wzAuto()}
document.addEventListener('close',e=>{if(e.target&&e.target.id=='dg'&&$('#dg .wz')&&!wzKeep){const w=WZ();if(w.act){w.act=false;wzSave(w)}}wzKeep=false},true);
</script>
